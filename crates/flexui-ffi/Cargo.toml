[package]
name = "flexui-ffi"
version = "0.1.0"
edition = "2021"
description = "C ABI static and dynamic library bindings for FlexUI"
repository.workspace = true
homepage.workspace = true
readme.workspace = true

[lib]
# rlib 供本 crate 的示例/测试链接；cdylib/staticlib 供 C/其它语言使用。
crate-type = ["lib", "cdylib", "staticlib"]

[dependencies]
flexui-core = { workspace = true }
flexui-xml = { workspace = true }

# cbindgen 仅用于「测试守住 include/flexui.h 与源码同步」，不进产物。
[dev-dependencies]
cbindgen = "0.27"

[target.'cfg(target_os = "macos")'.dependencies]
flexui-macos = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
flexui-windows = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
flexui-linux = { workspace = true }
