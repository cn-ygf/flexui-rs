# flexui-rs 工作区（macOS / Windows / Linux 三平台）
[workspace]
resolver = "2"
members = [
    "crates/flexui-resource",
    "crates/flexui-i18n",
    "crates/flexui-gfx",
    "crates/flexui-svg",
    "crates/flexui-native-menu",
    "crates/flexui-core",
    "crates/flexui-xml",
    "crates/flexui-macos",
    "crates/flexui-windows",
    "crates/flexui-linux",
    "crates/flexui",
    "crates/flexui-examples",
    "crates/flexui-gallery",
    "crates/flexui-ffi",
]

[workspace.package]
repository = "https://github.com/cn-ygf/flexui-rs"
homepage = "https://github.com/cn-ygf/flexui-rs"
readme = "README.md"

# 统一依赖版本，子 crate 用 workspace = true 引用
[workspace.dependencies]
flexui-gfx = { version = "0.1.0", path = "crates/flexui-gfx" }
flexui-svg = { version = "0.1.0", path = "crates/flexui-svg" }
flexui-native-menu = { version = "0.1.0", path = "crates/flexui-native-menu" }
flexui-resource = { version = "0.1.0", path = "crates/flexui-resource" }
flexui-i18n = { version = "0.1.0", path = "crates/flexui-i18n" }
flexui-core = { version = "0.1.0", path = "crates/flexui-core" }
flexui-xml = { version = "0.1.0", path = "crates/flexui-xml" }
flexui-macos = { version = "0.1.0", path = "crates/flexui-macos" }
flexui-windows = { version = "0.1.0", path = "crates/flexui-windows" }
flexui-linux = { version = "0.1.0", path = "crates/flexui-linux" }

# objc2 生态：仅是 macOS 系统 API 的 Rust 绑定，非第三方渲染/窗口框架
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unic-langid = "0.9"
intl_pluralrules = "7"
sys-locale = "0.3"
muda = { version = "0.19.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tray-icon = { version = "0.24.2", default-features = false }
url = "2"
