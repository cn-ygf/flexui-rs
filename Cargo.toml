# flexui-rs 工作区（一期只验证 macOS）
[workspace]
resolver = "2"
members = [
    "crates/flexui-geometry",
    "crates/flexui-resource",
    "crates/flexui-i18n",
    "crates/flexui-gfx",
    "crates/flexui-svg",
    "crates/flexui-native-menu",
    "crates/flexui-core",
    "crates/flexui-xml",
    "crates/flexui-macos",
    "crates/flexui-windows",
    "crates/flexui",
    "crates/flexui-examples",
    "crates/flexui-gallery",
    "crates/flexui-ffi",
]

# 统一依赖版本，子 crate 用 workspace = true 引用
[workspace.dependencies]
flexui-geometry = { path = "crates/flexui-geometry" }
flexui-gfx = { path = "crates/flexui-gfx" }
flexui-svg = { path = "crates/flexui-svg" }
flexui-native-menu = { path = "crates/flexui-native-menu" }
flexui-resource = { path = "crates/flexui-resource" }
flexui-i18n = { path = "crates/flexui-i18n" }
flexui-core = { path = "crates/flexui-core" }
flexui-xml = { path = "crates/flexui-xml" }
flexui-macos = { path = "crates/flexui-macos" }
flexui-windows = { path = "crates/flexui-windows" }

# objc2 生态：仅是 macOS 系统 API 的 Rust 绑定，非第三方渲染/窗口框架
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unic-langid = "0.9"
intl_pluralrules = "7"
sys-locale = "0.3"
muda = { version = "0.19.3", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tray-icon = { version = "0.24.2", default-features = false }
