[package]
name = "flexui"
version = "0.1.0"
edition = "2021"
description = "Cross-platform desktop UI framework with native windows, XML layouts, and a pure Rust API"
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords = ["gui", "desktop", "ui", "xml", "cross-platform"]
categories = ["gui"]

[dependencies]
flexui-core = { workspace = true }
flexui-xml = { workspace = true }
flexui-resource = { workspace = true }
flexui-i18n = { workspace = true }

# 按平台选择后端（编译期二选一）。
[target.'cfg(target_os = "macos")'.dependencies]
flexui-macos = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
flexui-windows = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
flexui-linux = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
